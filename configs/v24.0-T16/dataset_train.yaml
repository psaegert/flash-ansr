# v24.0-T16 train dataset: T14's format plus HYPOTHESIS MODE (the <hypothesize>
# flag licenses self-initiated complexity blocks; three-way mix 0.2 hypothesis /
# 0.4 prompted / 0.4 absent) -- T13's format plus the four ruled task extensions
# (2026-08-24): the noise mixture (post-accept, one definition with evaluation),
# the complexity block (50%% absent / 25%% nibbles / 25%% <float> summary), and the
# predict_y auxiliary block (1/3 of instances, a/b 50/50, clean holdout from the
# accepted support). Priors are pinned explicitly, never defaulted.
source:
  catalog: './catalog_train.yaml'
  sampling:
    n_support: prior
    n_validation: 0
    noise:
      p_clean: 0.30
      types: {additive: 0.5, multiplicative: 0.5}
      level: [1.0e-4, 0.3]
      outliers:
        p_instance: 0.10
        rate: [0.005, 0.1]
        magnitude: [3.0, 100.0]
tokenizer: './tokenizer.yaml'
padding: 'zero'
constant_representation: 'ieee754_mixed'
target_dialect: 'tagged'
condition_dropout: 0.1
complexity_block:
  p_present: 0.4
  p_nibbles: 0.5
  p_hypothesize: 0.2
# Promptable masking + constant infilling (owner rulings 2026-08-24, audited):
# flags 5/5/90 all/fittable/unmasked; partial on 10% of unflagged instances with
# per-slot 50/25/25 placeheld/expanded/compact; <predict_constants> attaches at
# 0.5 after flagged skeletons and 0.9 on partial instances (>=1 placeholder,
# CFG-conditioned, collection-stable only -- the gate withholds engine-internal
# values). Prompt elements permute per instance; suffix pair swaps 50/50.
mask_block:
  p_mask_all: 0.05
  p_mask_fittable: 0.05
  p_partial: 0.1
  p_placeheld: 0.5
  p_predict_constants_flagged: 0.5
  p_predict_constants_partial: 0.9

predict_y_block:
  p_present: 0.3333333333333333
  p_conditional: 0.5
  min_n_support: 8
