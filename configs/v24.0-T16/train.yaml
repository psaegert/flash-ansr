# v24.0-T16: THE FULL v24.0 RUN (3M params, 1.5M steps, solomon RTX 4090) -- the
# complete audited task set: noise mixture, outlier head, complexity block with
# hypothesis mode, predict_y, promptable masking and the <predict_constants>
# infilling block (collection-stability gated). T13/T15 architecture and batch;
# the house 10/70/20 trapezoid stretched to 1.5M steps (v23 trained 1M; the v24
# task mixture is harder -- owner ruling 2026-08-24). acj-4 pinned throughout.
model: ./model.yaml

optimizer:
  name: AdamW
  kwargs:
    lr: 1  # Will be multiplied by scheduler
    weight_decay: 0.01
    betas: [0.9, 0.95]

lr_schedule:
  - [0, 0.0]
  - [150_000, 1e-4]  # 10% of steps warmup
  - [1_200_000, 1e-4]
  - [1_500_000, 0.0]  # 20% of steps cooldown

batch_size: 128

train_dataset: ./dataset_train.yaml
val_dataset: "./dataset_val.yaml"
val_batch_size: 128
# 4x the T13 val size: the pilot's read is the per-task val curves, and 2,048
# instances left too much variance on them (owner request 2026-08-24).
val_size: 8_192

compile_mode: 'reduce-overhead'
gradient_checkpointing: False
preprocess: false

wandb_watch_log: null
wandb_watch_log_freq: 1000

steps: 1_500_000

# Outlier-head auxiliary loss (small: the head must not distort the encoder);
# pos_weight 1.0 = calibrated suspicion scores (ruling 2026-08-24).
outlier_loss_weight: 0.05
outlier_pos_weight: 1.0
device: cuda
