# v25.0-T8-20M: the T7-20M recipe with the three changes of the owner ruling 2026-09-07, after the
# T7-20M post-mortem (the pre-logits LayerNorm's gain and bias carried a loss-flat logit-offset
# drift that Adam's sign-persistence turned into a x50 logit blow-up and, through the bf16 head,
# into a ruined second half of the run):
#   1. AdaMuon (Si, Zhang, Shen 2025, arXiv:2507.11005) instead of AdamW. The hidden matrices take
#      the sign-stabilized, orthogonalized, variance-normalized, RMS-aligned update; embeddings, the
#      heads' projections and every bias or norm gain stay on AdamW. The RMS alignment reuses T7's
#      learning-rate schedule unchanged.
#   2. z-loss 1e-4 (PaLM's log^2 Z, fp32): the restoring force on the logit-offset direction.
#   3. No pre-logits LayerNorm (model.yaml head_pre_logits_norm: false): it moved the drift, it
#      did not remove it.
# Everything else is T7-20M's verbatim: the data pins (catalog_train.yaml with the depth and width
# priors on the plain sampler, symbolic-data 0.18.0, simplipy 0.14.6), the 20M shape, 1.5M steps
# on the 1/79/20 trapezoid (warmup 15k, constant 1e-4 to 1.2M, cooldown to 1.5M), checkpoints on
# the 25k grid so matched-step comparisons line up against T7-3M and T7-20M. If this run succeeds
# the recipe is the default for every run after it (owner ruling 2026-09-07).
#
# Numeric format: IEEE-754 binary64 throughout. Constants are 8 byte tokens over the
# 256-symbol alphabet; the encoder and the numeric channel are binary64.
#
# Task set, all trained together:
#   - expression emission (the primary cross-entropy);
#   - the <complexity> block -- stated by the caller as a compact <float>, hypothesized by
#     the model in bytes after <hypothesize>, or absent;
#   - <predict_y>, one held-out point per instance;
#   - <predict_constants>, one span per masked placeholder (collection-stability gated);
#   - promptable masking (<mask_all> / <mask_fittable> / partial);
#   - the per-point outlier head, against the noise mixture's contamination labels.
#
# acj-5-4-llm pinned throughout.
model: ./model.yaml

optimizer:
  name: AdaMuon
  kwargs:
    lr: 1  # Will be multiplied by scheduler; the RMS-aligned update makes T7's schedule the right one
    weight_decay: 0.1  # the hidden matrices (AdaMuon groups): the paper's default
    adam_weight_decay: 0.01  # embeddings and the heads' projections (AdamW groups): T7's value
    betas: [0.9, 0.95]  # the AdamW groups
    momentum: 0.95  # AdaMuon's coefficient for both its moments
    nesterov: true
    ns_steps: 5
    eps: 1.0e-8

lr_schedule:
  - [0, 0.0]
  - [15_000, 1e-4]  # 1% of steps warmup (T7 proportion)
  - [1_200_000, 1e-4]
  - [1_500_000, 0.0]  # 20% of steps cooldown

batch_size: 128

train_dataset: ./dataset_train.yaml
val_dataset: "./dataset_val.yaml"
val_batch_size: 128
# The validation pool is kept alive NEXT TO the training pool, so both coexist in memory:
# at num_workers=32 a same-size val pool would put ~64 x ~1.1 GB workers on the 60 GB box
# (T2 measured ~1.2 GB/worker at 18+18). 6 val workers cap the coexisting fleet at 38
# and only stretch validation wall time.
validate_num_workers: 6
# Sized for the per-task validation curves: 2,048 instances leaves too much
# variance on them to read a per-task trend.
val_size: 8_192

compile_mode: 'reduce-overhead'
gradient_checkpointing: False
preprocess: false

wandb_watch_log: null
wandb_watch_log_freq: 1000

steps: 1_500_000

# Outlier-head auxiliary loss, kept small so the head does not distort the encoder.
# pos_weight 1.0 yields calibrated suspicion scores rather than a tuned operating point.
outlier_loss_weight: 0.05
outlier_pos_weight: 1.0
# Cadence for the outlier head's AUROC/AUPRC. The loss is logged every step; the rank
# statistics need every micro-batch's scores on the host, so they run on an interval.
outlier_metrics_interval: 50

# z-loss (PaLM's log^2 Z, fp32): the restoring force on the loss-flat logit-offset direction that
# ran away in T7-20M. The logit-scale alarms train_log_z, train_logit_absmean and
# head_row_norm_max are logged every step; with the z-loss active train_log_z sits near 0.
z_loss_weight: 1.0e-4
device: cuda
