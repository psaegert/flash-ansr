sample_strategy:
  n_operator_distribution: "length_exponential"
  min_operators: 0
  max_operators: 17
  power: 0.7
  lambda: 1
  max_length: 35
  max_tries: 4
  independent_dimensions: true

allow_nan: false
simplify: true
simplify_mode: 'permissive'

# Literals at constant leaves: cauchy(0, 5), the v23.8 prior (owner ruling 2026-08-31;
# replaces the v24-era int/rounded mixture on this arm). Typed slots below keep their own
# priors -- they belong to the typed-exponent redesign, not to the literal prior.
literal_prior:
  name: cauchy
  kwargs:
    loc: 0
    scale: 5

# Typed slots (owner ruling 2026-09-02: priors follow elegant, accurate ideas and are only
# minimally shaped by the benchmark distribution). Three ideas, no fitted numbers:
#   sign symmetry     -- the canonical spells a negative exponent / root index in its own way,
#                        so the sign is a spelling choice the prior does not weight;
#   quadratic decay   -- integers 2..5 and root indices 2..5 at 16 : 9 : 4 : 1 (0 and +-1 fold
#                        to structure before delivery and are not drawn);
#   description length-- dyadic rationals p/q at 1/(|p| q), the same cost the MDL measure
#                        charges a literal; a 5% rounded-real tail keeps a non-rational
#                        exponent representable.
# Delivered (1,500 instances, same seed): exponent sites 85% integer / 2% decimal real /
# 13% rational (T5: 65 / 21 / 14); root index 2 at 44% (T5: 24%). The T5 rounded(normal) half
# put a multi-decimal real on one exponent site in five.
typed_slots:
  pow:
    argument: 1
    prior:
    - weight: 0.65            # integers 2..5, sign-symmetric, quadratic decay in rank (16, 9, 4, 1)
      name: choice
      kwargs:
        values: [2, -2, 3, -3, 4, -4, 5, -5]
        weights: [16, 16, 9, 9, 4, 4, 1, 1]
    - weight: 0.30            # dyadic rationals p/q, sign-symmetric, weight 1/(|p| q): description length
      name: choice
      kwargs:
        values: [0.5, -0.5, 0.25, -0.25, 1.5, -1.5, 2.5, -2.5, 0.75, -0.75]
        weights: [6, 6, 3, 3, 2, 2, 1.2, 1.2, 1, 1]
    - weight: 0.05            # real tail (rounded normal), so a non-rational exponent stays representable
      name: rounded
      kwargs:
        base:
          name: normal
          kwargs:
            loc: 0
            scale: 2
  rootn:
    argument: 1
    prior:
      name: choice
      kwargs:
        values: [2, -2, 3, -3, 4, -4, 5, -5]   # sign-symmetric, quadratic decay in rank (owner 2026-09-02)
        weights: [16, 16, 9, 9, 4, 4, 1, 1]
  # SimpliPy 0.15: the order of besselj(nu, x) is a pure integer (the benchmarks use 0..4); linear decay in nu.
  besselj:
    argument: 0
    prior:
      name: choice
      kwargs:
        values: [0, 1, 2, 3, 4]
        weights: [5, 4, 3, 2, 1]
  bessely:
    argument: 0
    prior:
      name: choice
      kwargs:
        values: [0, 1, 2, 3, 4]
        weights: [5, 4, 3, 2, 1]
  besseli:
    argument: 0
    prior:
      name: choice
      kwargs:
        values: [0, 1, 2, 3, 4]
        weights: [5, 4, 3, 2, 1]
  besselk:
    argument: 0
    prior:
      name: choice
      kwargs:
        values: [0, 1, 2, 3, 4]
        weights: [5, 4, 3, 2, 1]
  # SimpliPy 0.15: mod(a, b)'s divisor is a small integer (the benchmarks use 2, 3, 4, 5); linear decay.
  mod:
    argument: 1
    prior:
      name: choice
      kwargs:
        values: [2, 3, 4, 5]
        weights: [4, 3, 2, 1]

# Support prior restored to the v23.8 form (wandb run v238-1b-resync is the source of
# truth): box endpoints are cauchy(0, 10) and the box is UNCAPPED -- no [-30, 30] clip.
# The normal(0,10)+clip form T3 inherited descends from flash-ansr's v23.0/v23.1-era
# config snapshot; research moved to cauchy-uncapped at v23.2 and ran it through v23.8,
# but the change never crossed repos (1fc8528 then propagated the stale form into every
# catalog). Owner ruling 2026-08-31: no caps, cauchy like 23.8.
support_sampler:
  support_prior:
    name: "sampler"
    kwargs:
      base_dist_name: "uniform"
      param_samplers:
        low:
          name: "cauchy"
          kwargs: {loc: 0, scale: 10}
        high:
          name: "cauchy"
          kwargs: {loc: 0, scale: 10}
  n_support_prior:
    name: "uniform"
    kwargs:
      low: 1
      high: 1024
      min_value: 1
      max_value: 1024

variables: ['x1', 'x2', 'x3', 'x4', 'x5', 'x6', 'x7', 'x8', 'x9', 'x10', 'x11', 'x12', 'x13', 'x14', 'x15', 'x16', 'x17']

# v25.0-T5 operator prior (owner ruling 2026-09-02): pow/rootn 4 -> 5, everything else
# unchanged -- a deliberately minimal, non-overfitting reweight. Measured on T4@750k
# (prior_align.py): benchmark canonical laws carry transcendentals at x0.3-1.1 of the
# training token frequency and pow at x2-4.4; configured draw shares move
# transcendentals 22.6% -> 20.9%, pow+rootn 12.9% -> 14.9%. Delivered frequencies are
# re-measured before launch (canonicalization and rejection reshape them).
# Operator FAMILIES (owner ruling 2026-09-02, task #112): one independent coin per family,
# drawn once per expression, so the number of families is fixed per expression whatever its
# length (the per-node draw let every long expression collect every class: 89% of T4
# skeletons carried a transcendental, 53% carried all four classes). The coins are
# heuristics rounded to 5% -- powers less often than not, each transcendental family one in
# five, hyperbolics one in ten -- not fitted to the benchmark. Every present family carries
# the same total weight as the arithmetic base, uniform within the family. No operator is
# dropped by omission: the sampler refuses a family list that leaves a weighted operator out.
# Implied per-expression composition: pure arithmetic 40%, any transcendental 42%,
# two or more optional families 18%, all four 0.1%.

# Variables: the legacy draw (number of distinct leaf kinds uniform up to the leaf count, kinds
# uniform over x1..x17 plus the constant slot) stays -- owner ruling 2026-09-02: it makes sense
# on its own and a length-coupled replacement would have been shaped on the benchmark.

operator_weights:
  "+": 10
  "-": 10
  "*": 10
  "/": 10
  pow: 5
  rootn: 5
  abs: 1
  inv: 1
  neg: 1
  sin: 1
  cos: 1
  tan: 1
  asin: 1
  acos: 1
  atan: 1
  sinh: 1
  cosh: 1
  tanh: 1
  asinh: 1
  acosh: 1
  atanh: 1
  exp: 1
  log: 1
  # SimpliPy 0.15's operators, weight 1 each like every function.
  floor: 1
  ceil: 1
  erf: 1
  erfc: 1
  harmonic: 1
  max: 1
  min: 1
  mod: 1
  atan2: 1
  besselj: 1
  bessely: 1
  besseli: 1
  besselk: 1

# DEPTH-DECAYING UNARY PRIOR (owner design 2026-09-03): plain sampler, catalog weights, legacy leaves;
# unary mass w1 = 0.5 at chain depth 0, times nesting_decay^depth below; neg/inv transparent.
unary_mass: 0.5
nesting_decay: 0.25
nesting_transparent: [neg, inv]
# WIDTH PRIOR (owner design 2026-09-03, width/WIDTH_PRIOR.md): class stickiness on the arithmetic backbone,
# Markov rule (delta per switch), classes {+,-} / {*,/}, reset at counted unaries; mode label.
alternation_decay: 0.5
# COHERENCE PRIOR (owner 2026-11-03, alpha 0.35): the function nodes of one expression draw their family from a
# Dirichlet-multinomial urn around the families' weight shares (symbolic-data family_affinity); the operator weights
# decide inside a family. Real formulas: two function nodes share a family 87 % of the time against 29 % for
# independent labels (11,668 formulas); T8's independent draw gave 17 %. The families exclude each other in real
# formulas (trig|exp, trig|log, exp|log log odds ratio about -3) while powers and roots travel with all of them,
# so pow and rootn stay outside the urn. The Bessel functions and mod are function nodes here through their literal slots.
family_affinity:
  concentration: 0.35
  families:
    trig: [sin, cos, tan]
    inverse_trig: [asin, acos, atan]
    hyperbolic: [sinh, cosh, tanh]
    inverse_hyperbolic: [asinh, acosh, atanh]
    exp: [exp]
    log: [log]
    abs: [abs]
    erf: [erf, erfc]
    integer: [floor, ceil, mod]
    harmonic: [harmonic]
    bessel: [besselj, bessely, besseli, besselk]
  independent: [pow, rootn]
