# v25.0-T8.3: T8.1's catalog with three changes (owner 2026-11-03):
#   1. SimpliPy 0.15's engine and its 13 new operators: floor, ceil, erf, erfc, harmonic (unary) and max, min, mod,
#      atan2, besselj, bessely, besseli, besselk (binary), weight 1 each like every function. The Bessel orders and
#      mod's divisor are literal slots (typed_slots below): every benchmark use has an integer order 0..4 and a
#      small integer divisor, and a free subtree there mostly draws NaN (a non-integer order at x < 0) or a
#      near-zero divisor. bessely and besselk have no finite value at x <= 0 (NaN below 0, infinite at 0) and
#      besseli overflows at |x| >= 714 (measured on SimpliPy 0.15's realizations): the per-point rejection keeps
#      the valid rows.
#   2. The coherence prior (family_affinity, symbolic-data feat/family-affinity): one expression speaks one family
#      of functions. Alpha 0.35 (owner), the maximum-likelihood value over 11,668 real formulas (Wikidata and
#      Wikipedia science articles, no benchmark sets; 0.36, bootstrap 0.26-0.45); powers stay independent.
#   3. The holdout pools also cover the new srbf catalogs (owner 2026-10-13). Their names are not published yet:
#      the placeholder pool below fails closed, so this catalog cannot load until the list is filled in.
# The operator weights of the existing operators are unchanged (owner: the family marginals stay as they are).
# T8.1's header follows.
#
# v25.0-T7 catalog: the PLAIN sampler with two structural priors (owner design 2026-09-03, symbolic-data 0.18.0):
# catalog operator weights, legacy leaf draw, no families/profiles; unary_mass 1/2 (shape dial), the depth prior
# nesting_decay 1/4 with neg/inv transparent, and the width prior alternation_decay 1/2 (label mode). Measured as arm
# L_w12_d12 (3,000 delivered skeletons, 42-draw sheets read): transcendental 73%, realization failures 18%, any f(g)
# nesting 1.3%, six distinct variables in the median draw, backbone alt<=2 28% at 8-11 arithmetic operators.
# Everything else as T6: support endpoints cauchy(0,10) UNCAPPED, literal_prior cauchy(0,5), n_support 1-1024,
# max_tries 4, operator weights (pow/rootn 5, T5), holdout pools, typed-slot priors, cancellation rejection, canon.
# Base: v25.0-T3, the corrected target canon. Identical to v25.0-T2 in every pin
# except simplify_mode: targets canonicalize in the PERMISSIVE corpus tier, the
# designed choice -- data generates FROM the simplified skeleton (target == data),
# so the lossy tier is licensed and buys the denser canon (mean ratio 0.936 vs
# 0.966, 36.9% of draws strictly shorter). T2 -> T3 isolates the canon; T1 -> T2
# isolates the engine. Typed exponent slots for
# pow/rootn; support oversampling retired (whole-box rejection shapes the prior;
# support_oversampling_max defaults to 1 and is deliberately absent here).
type: lample_charton
simplipy_engine: 'acj2-5-4-llm'  # SimpliPy 0.15 (confirm the engine name at release)
# Lean engine profile (simplipy >= 0.14.2, symbolic-data >= 0.16.1): f64 is the always-eager
# construction substrate; permissive carries BOTH the target canon (simplify_mode below) and
# the holdout family key (HOLDOUT_SIMPLIFY_MODE). The real tier is never touched on this
# arm's data path, and would lazily load on first use if it ever were -- the profile moves
# worker memory (~100 MB each) and startup, never an output.
simplipy_engine_modes: ['f64', 'permissive']
