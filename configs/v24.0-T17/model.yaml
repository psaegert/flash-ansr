simplipy_engine: 'acj-4'
tokenizer: './tokenizer.yaml'

pre_encoder_noise_scale: 0.1

# v25: the numeric format, pinned explicitly rather than left to the code default (which
# stays 32 so the frozen v24 checkpoints keep loading their own width). Everything that
# reaches the encoder or the numeric channel is binary64 -- see flash_ansr.utils.numeric.
pre_encoder_bits: 64

encoder_max_n_variables: 18
encoder_dim: 192
encoder_n_heads: 3
encoder_n_isab: 1
encoder_n_sab: 1
encoder_n_inducing_points: 128
encoder_n_seeds: 128
encoder_ffn_hidden_dim: 576
encoder_dropout: 0.1
encoder_attn_norm: 'rms_set'
encoder_ffn_norm: 'rms_set'
encoder_output_norm: 'rms_set'

decoder_input_dim: 192
decoder_model_dim: 192
decoder_n_heads: 3
decoder_n_layers: 3
decoder_max_seq_len: 256
decoder_ffn_hidden_dim: 576
decoder_dropout: 0.1
decoder_block_self_attn_norm: 'rms'
decoder_block_cross_attn_norm: 'rms'
decoder_block_ffn_norm: 'rms'
decoder_cross_attn_kv_norm: 'rms'
decoder_output_norm: 'rms'
decoder_use_rope_self_attn: true
decoder_use_rope_cross_attn: false

use_checkpointing: false

# First-class optional condition (classifier-free guidance). When true, the model carries a learned
# `null_memory` and routes UNCONDITIONED examples (per-example condition_mask=False, set by the data
# layer via `condition_dropout` in dataset_train.yaml) to it -- a data-driven, train/inference-symmetric
# mode. Required whenever the dataset emits a condition_mask; the owner-ruled 10% dropout does.
# null_memory_init_seed selects the init.
optional_condition: true
null_memory_init_seed: 0

# v24 task extensions: per-point outlier head over the
# encoder's pre-pooling representations, trained against the noise mixture's
# generative contamination labels (see train.yaml: outlier_loss_weight).
outlier_head: true
