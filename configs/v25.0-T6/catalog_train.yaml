# v25.0-T6 catalog: T5 + per-expression operator PROFILES (symbolic-data operator_profiles).
# support endpoints cauchy(0,10) UNCAPPED, literal_prior cauchy(0,5), n_support 1-1024,
# max_tries 4. Typed slots, operator weights, holdout pools, canon: unchanged from T3.
# Base: v25.0-T3, the corrected target canon. Identical to v25.0-T2 in every pin
# except simplify_mode: targets canonicalize in the PERMISSIVE corpus tier, the
# designed choice -- data generates FROM the simplified skeleton (target == data),
# so the lossy tier is licensed and buys the denser canon (mean ratio 0.936 vs
# 0.966, 36.9% of draws strictly shorter). T2 -> T3 isolates the canon; T1 -> T2
# isolates the engine. Typed exponent slots for
# pow/rootn; support oversampling retired (whole-box rejection shapes the prior;
# support_oversampling_max defaults to 1 and is deliberately absent here).
type: lample_charton
simplipy_engine: 'acj-5-4-llm'
# Lean engine profile (simplipy >= 0.14.2, symbolic-data >= 0.16.1): f64 is the always-eager
# construction substrate; permissive carries BOTH the target canon (simplify_mode below) and
# the holdout family key (HOLDOUT_SIMPLIFY_MODE). The real tier is never touched on this
# arm's data path, and would lazily load on first use if it ever were -- the profile moves
# worker memory (~100 MB each) and startup, never an output.
simplipy_engine_modes: ['f64', 'permissive']
# Validation is a fresh stream from THIS catalog (see dataset_val.yaml), not a frozen
# artifact, so nothing beyond the benchmark pools below needs excluding.
holdout_pools: [
  # Every benchmark srbf may evaluate on. The training run must never see any of them, and
  # `holdout_pools` is baked into the corpus, so this list IS the commitment to an evaluation
  # suite -- widening the benchmark later means retraining.
  #
  # Measured over 3,000 draws replayed against nested pools: widening from fastsrb
  # alone to all 29 costs over-rejection but nothing in time -- `is_held_out` is a hash lookup,
  # O(1) in pool size, and the per-draw cost is dominated by evaluating the candidate, which
  # the one-catalog pool already paid.
  #
  # `fastsrb` resolves to v2 by default (fastsrb@2, the 2026-07-10 audit repair), so v2 is what this pool holds out.
  # `srsd-dummy` is listed for provenance though it adds ZERO keys: it is the same law set with
  # dummy variables, and the structure layer already generalizes over variable relabeling.
  "fastsrb",
  # classical SR suites
  "feynman", "feynman-bonus", "nguyen", "keijzer", "korns", "koza", "livermore", "livermore2",
  "vladislavleva", "jin", "neat", "pagie", "poly", "nonic", "sine", "meier", "r-rationals",
  "constant", "grammarvae",
  # physics / SRSD
  "physo-astro", "physo-class", "srsd-dummy",
  # SOOSE
  "soose-fc", "soose-nc", "soose-wc",
  # ERBench
  "erbench-densities", "erbench-phybench", "erbench-syneq"]

sample_strategy:
  n_operator_distribution: "length_exponential"
  min_operators: 0
  max_operators: 17
  power: 0.7
  lambda: 1
  max_length: 35
  max_tries: 4
  independent_dimensions: true

allow_nan: false
simplify: true
simplify_mode: 'permissive'

# Literals at constant leaves: cauchy(0, 5), the v23.8 prior (owner ruling 2026-08-31;
# replaces the v24-era int/rounded mixture on this arm). Typed slots below keep their own
# priors -- they belong to the typed-exponent redesign, not to the literal prior.
literal_prior:
  name: cauchy
  kwargs:
    loc: 0
    scale: 5

typed_slots:
  pow:
    argument: 1
    prior:
    - weight: 0.5
      name: choice
      kwargs:
        values: [2, -2, 3, -3, 4, -4, 5, -5, 1, -1, 0]
        weights: [4, 4, 3, 3, 2, 2, 1, 1, 1, 1, 1]
    - weight: 0.5
      name: rounded
      kwargs:
        base:
          name: normal
          kwargs:
            loc: 0
            scale: 2
  rootn:
    argument: 1
    prior:
      name: choice
      kwargs:
        values: [2, -2, 3, -3, 4, -4, 5, -5]
        weights: [4, 4, 3, 3, 2, 2, 1, 1]

# Support prior restored to the v23.8 form (wandb run v238-1b-resync is the source of
# truth): box endpoints are cauchy(0, 10) and the box is UNCAPPED -- no [-30, 30] clip.
# The normal(0,10)+clip form T3 inherited descends from flash-ansr's v23.0/v23.1-era
# config snapshot; research moved to cauchy-uncapped at v23.2 and ran it through v23.8,
# but the change never crossed repos (1fc8528 then propagated the stale form into every
# catalog). Owner ruling 2026-08-31: no caps, cauchy like 23.8.
support_sampler:
  support_prior:
    name: "sampler"
    kwargs:
      base_dist_name: "uniform"
      param_samplers:
        low:
          name: "cauchy"
          kwargs: {loc: 0, scale: 10}
        high:
          name: "cauchy"
          kwargs: {loc: 0, scale: 10}
  n_support_prior:
    name: "uniform"
    kwargs:
      low: 1
      high: 1024
      min_value: 1
      max_value: 1024

variables: ['x1', 'x2', 'x3', 'x4', 'x5', 'x6', 'x7', 'x8', 'x9', 'x10', 'x11', 'x12', 'x13', 'x14', 'x15', 'x16', 'x17']

# v25.0-T5 operator prior (owner ruling 2026-09-02): pow/rootn 4 -> 5, everything else
# unchanged -- a deliberately minimal, non-overfitting reweight. Measured on T4@750k
# (prior_align.py): benchmark canonical laws carry transcendentals at x0.3-1.1 of the
# training token frequency and pow at x2-4.4; configured draw shares move
# transcendentals 22.6% -> 20.9%, pow+rootn 12.9% -> 14.9%. Delivered frequencies are
# re-measured before launch (canonicalization and rejection reshape them).
# Per-expression operator profiles (owner design 2026-09-02; task #112). Measured on the T4
# prior, the per-node draw left 89% of skeletons with a transcendental and 0.9% single-class,
# vs 45% / 19% for the 656 benchmark laws (arith+pow 28%, arith+pow+trans 20%, pure arith 18%,
# arith+trans 13%). A profile is drawn once per expression; the unary/binary recursion runs on
# the profile's weight mass. Profile-local weights balance the unary classes so the class the
# profile names actually appears. Mixture weights are tuned to the measured law composition;
# the delivered composition is re-measured (class_purity.py) before launch.
# Per-expression prior on the number of distinct variables (task #112, second axis). The legacy
# draw is uniform up to the leaf count: 49% of delivered T4 skeletons used 6+ variables vs 12%
# of the benchmark laws (medians 5 vs 3). Weights follow the measured law distribution
# (1: 14%, 2: 25%, 3: 21%, 4: 17%, 5: 11%, 6: 6%, 7: 5%, 8: 1%); truncated to the leaf count.
n_unique_variables_prior:
  name: choice
  kwargs:
    values: [1, 2, 3, 4, 5, 6, 7, 8]
    weights: [14, 25, 21, 17, 11, 6, 5, 1]

operator_profiles:
  - {name: arith,           weight: 0.20, operators: ["+", "-", "*", "/"]}
  - {name: arith+pow,       weight: 0.28, operators: {"+": 10, "-": 10, "*": 10, "/": 10, pow: 8, rootn: 6}}
  - {name: arith+trans,     weight: 0.16, operators: {"+": 10, "-": 10, "*": 10, "/": 10, sin: 3, cos: 3, tan: 1, exp: 3, log: 3, asin: 1, acos: 1, atan: 1, sinh: 1, cosh: 1, tanh: 1, asinh: 1, acosh: 1, atanh: 1}}
  - {name: arith+pow+trans, weight: 0.28, operators: {"+": 10, "-": 10, "*": 10, "/": 10, pow: 6, rootn: 4, sin: 2, cos: 2, tan: 1, exp: 2, log: 2, asin: 1, acos: 1, atan: 1, sinh: 1, cosh: 1, tanh: 1, asinh: 1, acosh: 1, atanh: 1}}
  - {name: all,             weight: 0.08, operators: ["+", "-", "*", "/", pow, rootn, abs, inv, neg, sin, cos, tan, asin, acos, atan, sinh, cosh, tanh, asinh, acosh, atanh, exp, log]}

operator_weights:
  "+": 10
  "-": 10
  "*": 10
  "/": 10
  pow: 5
  rootn: 5
  abs: 1
  inv: 1
  neg: 1
  sin: 1
  cos: 1
  tan: 1
  asin: 1
  acos: 1
  atan: 1
  sinh: 1
  cosh: 1
  tanh: 1
  asinh: 1
  acosh: 1
  atanh: 1
  exp: 1
  log: 1
