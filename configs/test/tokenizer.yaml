  # v24 ieee754_mixed constants representation: expanded-form span tags and the 16
  # dedicated HEX NIBBLE tokens, in nibble-value order (deliberately distinct from the
  # digit literals they spell). A span is <ieee754> + 8 nibbles + </ieee754> = 10 tokens.
