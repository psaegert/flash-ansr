# The lane this vocabulary belongs to. Checked at Tokenizer.from_config, so a
# nibble-lane config loaded against the byte codec fails by NAME rather than as a
# confusing out-of-vocabulary error several layers down.
constants_format: "ieee754_bytes_f64"

special_tokens:
  - "<pad>"
  - "<bos>"
  - "<eos>"
  - "<unk>"
  - "<cls>"
  - "<mask>"
  - "<constant>"
  - "<prompt>"
  - "</prompt>"
  - "<expression>"
  - "</expression>"
  - "<complexity>"
  - "</complexity>"
  - "<float>"
  - "<allowed_term>"
  - "</allowed_term>"
  - "<include_term>"
  - "</include_term>"
  - "<exclude_term>"
  - "</exclude_term>"
  - '0'
  - '1'
  - '(-1)'
  - 'np.pi'
  - 'np.e'
  - 'float("inf")'
  - 'float("-inf")'
  - 'float("nan")'
  # v24 ieee754_mixed constants representation: expanded-form span tags and the 16
  # dedicated HEX NIBBLE tokens, in nibble-value order (deliberately distinct from the
  # digit literals they spell). A span is <ieee754> + 8 nibbles + </ieee754> = 10 tokens.
  # The compact form reuses the existing '<float>' token above.
  - "<ieee754>"
  - "</ieee754>"
