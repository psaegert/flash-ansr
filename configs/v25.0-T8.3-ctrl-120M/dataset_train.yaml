# v25.0-T1 train dataset. Priors are pinned explicitly, never defaulted.
#
# The complexity block is drawn three ways per instance: 0.2 hypothesized, 0.4 stated,
# 0.4 absent. A STATED complexity is a compact <float> carrying its value on the numeric
# channel, and is pure context. A HYPOTHESIZED one sits after <hypothesize> -- the boundary
# past which the model authors its own blocks -- and is spelled in IEEE-754 bytes, opener
# and closers included. No instance carries both: what the caller states, the model does
# not restate.
#
# <predict_y> attaches to 1/3 of instances, half before the expression and half after, on a
# point deleted from the encoder's support so the target is genuinely held out. Its
# coordinates are caller-supplied and therefore compact; its target is the model's and
# therefore bytes.
#
# The noise mixture is applied post-acceptance, with one definition shared with evaluation.
source:
  catalog: './catalog_train.yaml'
  sampling:
    n_support: prior
    n_validation: 0
    noise:
      p_clean: 0.30
      types: {additive: 0.5, multiplicative: 0.5}
      level: [1.0e-4, 0.3]
      # Outlier prior, derived against the literature (see the symbolic_data.noise
      # docstring). kappa is measured against what the neighbouring points fail to predict,
      # not against the spread of the signal.
      outliers:
        p_instance: 0.10                    # no literature analogue
        rate: {name: beta, a: 1.0, b: 9.0}  # Kennedy et al. 2017; Oztuerk & Karabatsos 2017;
                                            # matches ADBench's 47 real datasets (p50 6.3%)
        magnitude: {name: lognormal, median: 5.0, sigma: 1.4}   # smooth, unbounded, fades
                                            # both ends; log-scaling per Hogg, Bovy & Lang 2010
        scale: neighbour                    # kappa vs what the nearest neighbour in x misses
        sign: {mixed: 0.5, up: 0.25, down: 0.25}   # per problem; ours, unsourced
        min_count: 1                        # Hoeting, Raftery & Madigan 1996
tokenizer: './tokenizer.yaml'
padding: 'zero'
target_dialect: 'tagged'
condition_dropout: 0.1
complexity_block:
  p_present: 0.4
  p_hypothesize: 0.2
# Promptable masking + constant infilling: flags 5/5/90 all/fittable/unmasked; partial on
# 10% of unflagged instances, where each slot is independently a <constant> placeholder or
# its spelled value at 50/50. <predict_constants> attaches at 0.5 after flagged skeletons
# and 0.9 on partial instances (>=1 placeholder, CFG-conditioned, collection-stable only --
# the gate withholds engine-internal values). Given prompt elements permute per instance;
# the suffix pair swaps 50/50.
mask_block:
  p_mask_all: 0.05
  p_mask_fittable: 0.05
  p_partial: 0.1
  p_placeheld: 0.5
  p_predict_constants_flagged: 0.5
  p_predict_constants_partial: 0.9

predict_y_block:
  p_present: 0.3333333333333333
  p_conditional: 0.5
  min_n_support: 8

# <predict_residual>: how far the observation at a point sits off the law -- the same shape
# as predict_y and the same cost, but a different question. The point is NOT held out (the
# observation has to reach the model through the encoder for the target to be answerable),
# the block is dropped rather than moved on an unconditioned instance (with nulled memory
# the observation is unreachable in either placement), and it draws its point from what
# predict_y left. p_clean above means ~30% of these targets are exactly zero, which is not
# degenerate: telling a clean instance from a contaminated one is part of the task.
residual_block:
  p_present: 0.3333333333333333
  p_conditional: 0.5
  min_n_support: 8
