  - "<add>"
  - "</add>"
  - "<sub>"
  - "<mul>"
  - "</mul>"
  - "<div>"
  # --- the generation-2 operator set, engine order ---
  # '+', '-', '*' and '/' never appear in a tagged target (the delimiters above carry
  # them); they remain the engine's operator set for the explicit-dialect conversion and
  # realization paths.
  - "+"
  - "-"
  - "neg"
  - "*"
  - "/"
  - abs
