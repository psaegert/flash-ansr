# v24.0 TARGET-FORMAT TEMPLATE TOKENIZER
#
# What this vocabulary pins (verified against a live engine by the template tests):
#
#  1. TARGETS ARE THE TAGGED CANONICAL FORM. The training target is simplipy's native
#     `simplify` output -- n-ary bags delimited by <add>/</add> and <mul>/</mul>, with
#     <sub>/<div> marking the inverted members. There is NO dialect conversion and NO
#     masking step anywhere in the v24 target path.
#  2. NO EXPLICIT NUMBER TOKENS. Every numeric literal -- including structural exponents
#     such as the 2 in pow(x, 2) -- rides the ieee754 constants format. The integers
#     -10..10, the '0'/'1'/'(-1)' literals and the non-finite float() spellings are gone.
#     np.pi and np.e STAY: the AC engine keeps special constants symbolic, so they are not
#     numeric literals in this dialect and have no decimal spelling to serialize.
#  3. GENERATION-2 OPERATORS ONLY. The 23-operator clean vocabulary; no generation-1 sugar
#     (pow2..pow5, pow1_2..pow1_5, mult2..mult5, div2..div5 are all retired; `pow` and
#     `rootn` carry them, with the exponent as an ieee754 literal).
#  4. BYTE CONSTANTS AT BINARY64. A constant is <ieee754> + 8 byte tokens over the
#     256-symbol <b00>..<bff> alphabet + </ieee754> = 10 tokens. The span width is
#     unchanged from the nibble lane; the alphabet and the value semantics are not.
#     <float> is the CALLER-supplied form only, never emitted.
#
# This is a TEMPLATE: `variables` mirrors the v23.0-120M run config (x1..x17) so vocabulary
# sizes compare like for like; a concrete v24 run config copies it and adjusts.
#
# The tagged delimiters live under `operators` rather than `special_tokens` deliberately:
# they are EXPRESSION tokens and must survive `Tokenizer.decode(..., special_tokens=...)`,
# which filters special tokens out.

# The lane this vocabulary belongs to. Checked at Tokenizer.from_config, so a
# nibble-lane config loaded against the byte codec fails by NAME rather than as a
# confusing out-of-vocabulary error several layers down.
constants_format: "ieee754_bytes_f64"

special_tokens:
  - "<pad>"
  - "<bos>"
  - "<eos>"
  - "<unk>"
  - "<cls>"
  - "<mask>"
  # Kept for the refiner handshake: expanded spans map back to '<constant>' skeleton slots
  # (contract T11). It never appears in a v24 training target.
  - "<constant>"
  - "<prompt>"
  - "</prompt>"
  - "<expression>"
  - "</expression>"
  - "<complexity>"
  - "</complexity>"
  # The two query/answer blocks, identical in shape:
  #   <predict_y>        <point> <float>*dims </point> <ieee754> 8 bytes </ieee754> </predict_y>
  #   <predict_residual> <point> <float>*dims </point> <ieee754> 8 bytes </ieee754> </predict_residual>
  # Openers and the point are harness-fed and loss-masked; the model owns the answer bytes
  # and the closing tags. predict_y asks for the target at a HELD-OUT point; predict_residual
  # asks how far the observation at a point the model can see sits off the law.
  # Hypothesis-mode flag: harness-inserted, never model-emitted; licenses the model to
  # open property blocks (e.g. <complexity>) on its own.
  - "<hypothesize>"
  # Promptable-mask flags: harness-owned, never supervised.
  # Named after simplipy's masking policies; no flag = the unmasked default target.
  - "<mask_all>"
  - "<mask_fittable>"
  # The constant-infilling block: one <ieee754> span per <constant> placeholder, in
  # positional order, appended after </expression>. The placeholder is simplipy's
  # native <constant>.
  - "<predict_constants>"
  - "</predict_constants>"
  - "<predict_y>"
  - "</predict_y>"
  - "<predict_residual>"
  - "</predict_residual>"
  - "<point>"
  - "</point>"
  # The compact form of a CALLER-SUPPLIED number: loss-masked as a target, value on the
  # numeric channel. Query coordinates and a stated complexity use it; nothing the model
  # predicts does.
  - "<float>"
  - "<allowed_term>"
  - "</allowed_term>"
  - "<include_term>"
  - "</include_term>"
  - "<exclude_term>"
  - "</exclude_term>"
  # Symbolic constants: NOT numeric literals in the tagged canonical dialect.
  - 'np.pi'
  - 'np.e'
  # constants format: span tags + the 256 byte tokens in byte-value order (generated,
  # never hand-typed: see BYTE_TOKENS in flash_ansr.utils.ieee754).
  - "<ieee754>"
  - "</ieee754>"
  - "<b00>"
  - "<b01>"
