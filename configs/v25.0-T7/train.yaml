# v25.0-T7: the plain-sampler-with-depth-and-width-priors arm (3M params, 1M steps, solomon RTX 4090). Training pins as T6 (trapezoid, AdamW, warmup 10k over 1M steps, head_pre_logits_norm); the data delta is catalog_train.yaml: no operator families, unary_mass 1/2, nesting_decay 1/4, alternation_decay 1/2 (symbolic-data 0.18.0, simplipy 0.14.6 with the permissive literal fold).
#
# Identical to v25.0-T2 except the catalog's simplify_mode: the contrast against T2
# is target-canon-only by construction. Two OPERATIONAL keys differ and touch no data:
# the catalog's simplipy_engine_modes (lean per-worker engines, identical outputs) and
# validate_num_workers below (validation-pool size; owner 2026-08-30: all cores for the
# training pool).
#
# Numeric format: IEEE-754 binary64 throughout. Constants are 8 byte tokens over the
# 256-symbol alphabet; the encoder and the numeric channel are binary64.
#
# Task set, all trained together:
#   - expression emission (the primary cross-entropy);
#   - the <complexity> block -- stated by the caller as a compact <float>, hypothesized by
#     the model in bytes after <hypothesize>, or absent;
#   - <predict_y>, one held-out point per instance;
#   - <predict_constants>, one span per masked placeholder (collection-stability gated);
#   - promptable masking (<mask_all> / <mask_fittable> / partial);
#   - the per-point outlier head, against the noise mixture's contamination labels.
#
# The 1/79/20 trapezoid over 1M steps (owner ruling 2026-09-02: 1M steps since T6, not 1.5M). acj-5-4-llm pinned throughout.
model: ./model.yaml

optimizer:
  name: AdamW
  kwargs:
    lr: 1  # Will be multiplied by scheduler
    weight_decay: 0.01
    betas: [0.9, 0.95]

lr_schedule:
  - [0, 0.0]
  - [10_000, 1e-4]  # 1% of steps warmup (owner ruling 2026-09-02; T4 used 10% = 150k)
  - [800_000, 1e-4]
  - [1_000_000, 0.0]  # 20% of steps cooldown

batch_size: 128

train_dataset: ./dataset_train.yaml
val_dataset: "./dataset_val.yaml"
val_batch_size: 128
# The validation pool is kept alive NEXT TO the training pool, so both coexist in memory:
# at num_workers=32 a same-size val pool would put ~64 x ~1.1 GB workers on the 60 GB box
# (T2 measured ~1.2 GB/worker at 18+18). 6 val workers cap the coexisting fleet at 38
# and only stretch validation wall time.
validate_num_workers: 6
# Sized for the per-task validation curves: 2,048 instances leaves too much
# variance on them to read a per-task trend.
val_size: 8_192

compile_mode: 'reduce-overhead'
gradient_checkpointing: False
preprocess: false

wandb_watch_log: null
wandb_watch_log_freq: 1000

steps: 1_000_000

# Outlier-head auxiliary loss, kept small so the head does not distort the encoder.
# pos_weight 1.0 yields calibrated suspicion scores rather than a tuned operating point.
outlier_loss_weight: 0.05
outlier_pos_weight: 1.0
# Cadence for the outlier head's AUROC/AUPRC. The loss is logged every step; the rank
# statistics need every micro-batch's scores on the host, so they run on an interval.
outlier_metrics_interval: 50
# No z-loss (owner ruling 2026-09-02: no old workarounds since T6). The v25.x runs carried
# z_loss_weight 1e-4 as the stopgap against the shared byte-logit offset runaway (T4 at
# ~648k); T6 removed the pathway instead: model.yaml head_pre_logits_norm normalizes the
# head input before the final projection. val_z_loss stays logged (weight 0) as a monitor.
z_loss_weight: 0.0
device: cuda
