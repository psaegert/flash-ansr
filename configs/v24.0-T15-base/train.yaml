# v24.0-T15-base: the CONTROL arm at the T13 scale (3M, 20k steps) -- T15's catalog
# (acj-4, oversampling retired) with every task extension OFF, so the paired reads are
# T13 vs T14-base (catalog/engine move) and T14-base vs T14 (the new tasks).
model: ./model.yaml

optimizer:
  name: AdamW
  kwargs:
    lr: 1  # Will be multiplied by scheduler
    weight_decay: 0.01
    betas: [0.9, 0.95]

lr_schedule:
  - [0, 0.0]
  - [2_000, 1e-4]  # 10% of steps warmup
  - [16_000, 1e-4]
  - [20_000, 0.0]  # 20% of steps cooldown

batch_size: 128

train_dataset: ./dataset_train.yaml
val_dataset: "./dataset_val.yaml"
val_batch_size: 128
# 4x the T13 val size: the pilot's read is the per-task val curves, and 2,048
# instances left too much variance on them (owner request 2026-08-24).
val_size: 8_192

compile_mode: 'reduce-overhead'
gradient_checkpointing: False
preprocess: false

wandb_watch_log: null
wandb_watch_log_freq: 1000

steps: 20_000

device: cuda
